<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卡片練習</title>
    <link rel="stylesheet" href="../general/lib/reset/default-reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <article class="normal-card">
        <figure class="normal-card_img">
          <img src="https://picsum.photos/seed/picsum/700/300" alt="" />
        </figure>

        <div class="normal-card_content">
          <div class="card-info">
            <p class="price">NT$3,800</p>
            <button class="event-btn add-cart">
              <span class="btn-text">加入購物車</span>
            </button>
            <button class="event-btn buy-now">
              <span class="btn-text">直接購買</span>
            </button>
          </div>
          <div class="card-detail">
            <p>此課程包含</p>
            <ul>
              <li>終身存取權</li>
              <li>行動裝置隨時學習</li>
              <li>9.9 小時課程內容</li>
              <li>完課證書</li>
            </ul>
          </div>
        </div>
        <footer class="normal-card_foot">
          <span>公司同事一起學更划算！</span>
          <a href="#!" class="normal-card_more-link">歡迎洽詢企業方案</a>
        </footer>
      </article>
    </main>
  </body>
</html>
